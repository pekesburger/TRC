<body class="overflow-x-hidden">

<main class="pt-24 pb-16 px-4 sm:px-6 max-w-5xl mx-auto">

    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 sm:gap-5" id="categories"></div>

<div id="modal" class="modal fixed inset-0 z-50 hidden flex items-center justify-center p-4">

        <div class="p-6 sm:p-10" id="modal-content"></div>
    </div>
</div>

<div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
<div id="cart-panel">
    <div class="p-5 flex items-center justify-between border-b border-white/10 bg-black/90 backdrop-blur z-10">
        <h2 class="brand-font text-2xl text-[#F26522] font-bold">Tu Pedido</h2>
        <button onclick="closeCart()" class="text-white/60 hover:text-white text-3xl transition leading-none">×</button>
    </div>
    <div class="px-5 py-4 border-b border-white/10 space-y-3">

    <div id="cart-items" class="px-5 py-4 space-y-2 flex-1">

        Object.keys(fb).forEach(k=>{
          const arr=Array.isArray(fb[k])?fb[k]:Object.values(fb[k]||{});
          m[k]=arr.filter(Boolean).map(it=>{const o={name:it.name,price:+it.price||0,desc:it.desc||''};if(it.sizes){const sz=(Array.isArray(it.sizes)?it.sizes:Object.values(it.sizes)).filter(Boolean).map(z=>({label:z.label,price:+z.price||0}));if(sz.length)o.sizes=sz;}return o;});
        });
        Object.keys(m).forEach(k=>{MENU_DATA[k]=m[k];});
        const modal=document.getElementById('modal');
        if(currentSec&&modal&&!modal.classList.contains('hidden'))openModal(currentSec);
      }
    });
  }
}catch(e){console.warn('Menú en vivo no disponible:',e);}

const sections=[
    {id:"hamburguesas",title:"HAMBURGUESAS",icon:"fa-burger"},
    {id:"promos",title:"PROMOS",icon:"fa-tags"},
    {id:"papas",title:"PAPAS",icon:"fa-bowl-food"},
    {id:"extras",title:"EXTRAS",icon:"fa-plus"},
    {id:"parrilla",title:"PARRILLA",icon:"fa-fire"},
    {id:"antojitos",title:"ANTOJITOS",icon:"fa-pepper-hot"},
    {id:"acompanar",title:"PARA ACOMPAÑAR",icon:"fa-utensils"},
    {id:"bebidas",title:"BEBIDAS",icon:"fa-glass-water"},
    {id:"cervezas",title:"CERVEZAS",icon:"fa-beer-mug-empty"},
    {id:"licores",title:"LICORES",icon:"fa-martini-glass-citrus"},
    {id:"postres",title:"POSTRES",icon:"fa-ice-cream"}
];

const container=document.getElementById('categories');
sections.forEach((sec,index)=>{
    const card=document.createElement('button');
    card.className='category-card';
    card.innerHTML=`<div class="cat-inner flex flex-col items-center justify-center py-8 px-3 gap-3">
        <i class="fas ${sec.icon} cat-icon text-4xl sm:text-5xl"></i>
        <h2 class="brand-font text-lg sm:text-xl font-bold tracking-wide text-white text-center leading-tight">${sec.title}</h2>
    </div>`;
    card.onclick=()=>openModal(sec);
    container.appendChild(card);
    setTimeout(()=>card.classList.add('appear'),100+index*90);
});

function slugify(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'-');}
function ea(s){return (s||'').toString().replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

let MODAL={};
function renderItemControl(slug){
    const el=document.getElementById('ctrl-'+slug);
    const m=MODAL[slug];
    if(!el||!m)return;
    const key=m.name+'|'+(m.size||'');
    const ci=cart.find(i=>(i.name+'|'+(i.size||''))===key);
    const qty=ci?ci.qty:0;
    if(qty<=0){
        el.innerHTML=`<button class="add-btn bg-[#F26522] text-black w-9 h-9 rounded-full flex items-center justify-center font-bold text-xl" onclick="addToCart('${ea(m.name)}',${m.price},'${ea(m.desc)}','${ea(m.size||'')}')">+</button>`;
    }else{
        el.innerHTML=`<div class="flex items-center gap-2 bg-black/40 rounded-full px-1 py-0.5">
            <button class="qty-btn bg-white/15 hover:bg-white/30 text-white" onclick="removeFromCart('${ea(m.name)}','${ea(m.size||'')}')">−</button>
            <span class="text-[#F26522] font-bold w-6 text-center">${qty}</span>
            <button class="qty-btn bg-[#F26522] text-black" onclick="addToCart('${ea(m.name)}',${m.price},'${ea(m.desc)}','${ea(m.size||'')}')">+</button>
        </div>`;
    }
}
function refreshModalControls(){Object.keys(MODAL).forEach(renderItemControl);}

function openModal(sec){
    currentSec=sec;
    const modal=document.getElementById('modal');
    const content=document.getElementById('modal-content');
    const items=MENU_DATA[sec.id]||[];
    MODAL={};
    const sizeName=s=>s.label.split('$')[0].trim();
    let itemsHtml=items.map(item=>{
        const hasSizes=item.sizes&&item.sizes.length>0;
        const slug=slugify(item.name);
        const sizesHtml=hasSizes?`<div class="flex gap-2 mt-2 flex-wrap" id="sizes-${slug}">`+item.sizes.map((s,i)=>`<button class="size-btn ${i===0?'selected':''}" onclick="selectSize('${slug}',${i},${s.price},'${ea(item.name)}','${ea(sizeName(s))}')">${s.label}</button>`).join('')+`</div>`:'';
        const displayPrice=hasSizes?item.sizes[0].price:item.price;
        const initSize=hasSizes?sizeName(item.sizes[0]):'';
        MODAL[slug]={name:item.name,desc:item.desc||'',price:displayPrice,size:initSize};
        return`<div class="flex justify-between items-start border-b border-white/15 pb-4 gap-4"><div class="flex-1"><span class="font-bold block">${item.name}</span>${item.desc?`<small class="text-white/60 block leading-snug mt-0.5">${item.desc}</small>`:''}${sizesHtml}</div><div class="flex items-center gap-3 flex-shrink-0"><span class="font-bold text-lg text-[#F26522]" id="price-${slug}">$${displayPrice}</span><div id="ctrl-${slug}"></div></div></div>`;
    }).join('');
    content.innerHTML=`<h2 class="brand-font text-3xl sm:text-4xl font-bold text-center mb-6 text-[#F26522] tracking-wide">${sec.title}</h2><div class="space-y-4">${itemsHtml}</div>`;
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    refreshModalControls();
}

window.selectSize=function(slug,idx,price,itemName,size){
    document.querySelectorAll(`#sizes-${slug} .size-btn`).forEach((b,i)=>b.classList.toggle('selected',i===idx));
    document.getElementById(`price-${slug}`).textContent=`$${price}`;
    if(MODAL[slug]){MODAL[slug].size=size;MODAL[slug].price=price;}
    renderItemControl(slug);
};

function closeModal(){
    document.getElementById('modal').classList.add('hidden');
    document.getElementById('modal').classList.remove('flex');
}
document.addEventListener('keydown',e=>{if(e.key==="Escape")closeModal();});

// ==================== CARRITO ====================
let cart=[];
function cartKey(name,size){return name+'|'+(size||'');}

window.addToCart=function(name,price,desc,size){
    size=size||'';
    const existing=cart.find(i=>cartKey(i.name,i.size)===cartKey(name,size));
    if(existing)existing.qty++;
    else cart.push({name,price,desc,size,qty:1});
    updateCartUI();
    showToast(`+ ${name}${size?' ('+size+')':''}`);
};

window.removeFromCart=function(name,size){
    const idx=cart.findIndex(i=>cartKey(i.name,i.size)===cartKey(name,size||''));
    if(idx===-1)return;
    if(cart[idx].qty>1)cart[idx].qty--;
    else cart.splice(idx,1);
    updateCartUI();
};

function clearCart(){cart=[];updateCartUI();}

function updateCartUI(){
    const badge=document.getElementById('cart-badge');
    const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
    const count=cart.reduce((s,i)=>s+i.qty,0);
    badge.textContent=count;
    count>0?badge.classList.remove('hidden'):badge.classList.add('hidden');
    document.getElementById('cart-total').textContent=`$${total}`;
    const fc=document.getElementById('float-cart');
    const cartOpen=document.getElementById('cart-panel').classList.contains('open');
    if(count>0&&!cartOpen){fc.classList.remove('hidden');fc.classList.add('flex');}
    else{fc.classList.add('hidden');fc.classList.remove('flex');}
    document.getElementById('float-cart-count').textContent=count+' art.';
    document.getElementById('float-cart-total').textContent=`$${total}`;
    const el=document.getElementById('cart-items');
    if(cart.length===0){el.innerHTML=`<p class="text-white/30 text-sm text-center py-8">Tu carrito está vacío</p>`;refreshModalControls();return;}
    el.innerHTML=cart.map(item=>`<div class="item-row py-3 flex items-center justify-between gap-3"><div class="flex-1 min-w-0"><p class="text-white text-sm font-medium truncate">${item.name}${item.size?` <span class="text-white/50">(${item.size})</span>`:''}</p><p class="text-[#F26522] text-xs">$${item.price} c/u</p></div><div class="flex items-center gap-2"><button class="qty-btn bg-white/10 hover:bg-white/20 text-white" onclick="removeFromCart('${ea(item.name)}','${ea(item.size||'')}')">−</button><span class="text-white font-bold w-5 text-center text-sm">${item.qty}</span><button class="qty-btn bg-[#F26522]/20 hover:bg-[#F26522]/40 text-[#F26522]" onclick="addToCart('${ea(item.name)}',${item.price},'','${ea(item.size||'')}')">+</button></div><span class="text-white font-bold text-sm w-14 text-right">$${item.price*item.qty}</span></div>`).join('');
    refreshModalControls();
}

function openCart(){document.getElementById('cart-panel').classList.add('open');document.getElementById('cart-overlay').classList.add('active');document.getElementById('float-cart').classList.add('hidden');document.getElementById('float-cart').classList.remove('flex');}
function closeCart(){document.getElementById('cart-panel').classList.remove('open');document.getElementById('cart-overlay').classList.remove('active');updateCartUI();}

// ==================== ENVÍO DE PEDIDO (Firebase) ====================
function sendOrder(){
    if(cart.length===0){showToast('Agrega algo primero 😊');return;}
    const table=document.getElementById('table-input').value.trim();
    const phone=document.getElementById('phone-input').value.trim();
    if(!table){showToast('Escribe tu nombre 🙂');return;}
    if(phone.replace(/\D/g,'').length<10){showToast('Escribe un celular válido (10 dígitos) 📱');return;}
    if(typeof db==='undefined'||!db){showToast('⚠️ Falta configurar Firebase');return;}
    const newNotes=document.getElementById('order-notes').value.trim();
    const id=Date.now();
    const items=cart.map(i=>({...i}));
    const norm=s=>(s||'').trim().toLowerCase();
    db.ref('orders').once('value').then(snap=>{
        const all=snap.val()||{};
        const existing=Object.values(all).find(o=>o&&o.table&&norm(o.table)===norm(table)&&o.status!=='cobrado'&&o.status!=='cancelado');
        if(existing){
            const merged=Array.isArray(existing.items)?existing.items.map(i=>({...i})):[];
            items.forEach(c=>{
                const f=merged.find(i=>cartKey(i.name,i.size)===cartKey(c.name,c.size));
                if(f)f.qty+=c.qty; else merged.push({...c});
            });
            const total=merged.reduce((s,i)=>s+i.price*i.qty,0);
            const notes=[existing.notes,newNotes].filter(Boolean).join(' | ');
            return db.ref('orders/'+existing.id).update({items:merged,total,status:'nuevo',phone:phone||existing.phone||'',notes})
                     .then(()=>'¡Se sumó a tu pedido anterior! 🍔');
        }else{
            const order={id,table,phone,notes:newNotes,items,total:items.reduce((s,i)=>s+i.price*i.qty,0),status:'nuevo',createdAt:new Date().toISOString()};
            return db.ref('orders/'+id).set(order).then(()=>'¡Pedido enviado a cocina! 🍔');
        }
    }).then(msg=>{
        clearCart();
        document.getElementById('table-input').value='';
        document.getElementById('phone-input').value='';
        document.getElementById('order-notes').value='';
        closeCart();
        showToast(msg);
    }).catch(err=>{console.error(err);showToast('Error al enviar. Revisa tu conexión.');});
}

function showToast(msg){
    const t=document.getElementById('toast');
    t.textContent=msg;t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
