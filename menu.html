    <style>

        html,body{font-family:'Poppins',sans-serif;background:#0c0c0d;color:#fff;min-height:100vh}
        body{background-image:radial-gradient(circle at 50% 0%,rgba(242,101,34,.18),transparent 55%),radial-gradient(circle at 85% 90%,rgba(242,101,34,.10),transparent 45%);background-attachment:fixed}
        .logo-font{font-family:'Playfair Display',serif}
        .brand-font{font-family:'Poppins',sans-serif;font-weight:700}
        .cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;opacity:0;pointer-events:none;transition:opacity .35s}
        .cart-overlay.active{opacity:1;pointer-events:auto}
        .modal{background:rgba(12,12,13,.85);backdrop-filter:blur(6px)}
        .modal-content{background:#141416;background-image:radial-gradient(circle at 50% -10%,rgba(242,101,34,.15),transparent 55%)}
        /* Tarjetas de categoría con ícono */
        .category-card{transform:translateY(24px);opacity:0;transition:all .5s ease-out}
        .category-card.appear{transform:translateY(0);opacity:1}
        .cat-inner{background:linear-gradient(150deg,#1c1c1f 0%,#161618 100%);border:1px solid rgba(242,101,34,.28);border-radius:24px;transition:all .25s;height:100%}
        .category-card:hover .cat-inner{border-color:#F26522;transform:translateY(-4px);box-shadow:0 16px 40px rgba(242,101,34,.28)}
        .cat-icon{color:#F26522;transition:transform .25s}
        .category-card:hover .cat-icon{transform:scale(1.12)}
        #cart-panel{position:fixed;right:-440px;top:0;bottom:0;width:420px;max-width:100vw;background:rgba(10,10,10,.97);backdrop-filter:blur(20px);border-left:1px solid rgba(242,101,34,.3);z-index:200;transition:right .4s cubic-bezier(.4,0,.2,1);overflow-y:auto;display:flex;flex-direction:column}
        #cart-panel.open{right:0}
        .qty-btn{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;line-height:1;transition:all .15s}
        .cart-badge{position:absolute;top:-8px;right:-8px;background:#F26522;color:#000;border-radius:50%;width:20px;height:20px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
        .item-row{border-bottom:1px solid rgba(255,255,255,.08)}
        .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#F26522;color:#000;padding:10px 22px;border-radius:99px;font-weight:600;font-size:.9rem;z-index:999;transition:transform .35s;pointer-events:none;box-shadow:0 8px 24px rgba(242,101,34,.4)}
        .toast.show{transform:translateX(-50%) translateY(0)}
        .size-btn{border:1px solid rgba(242,101,34,.4);border-radius:8px;padding:4px 12px;font-size:.78rem;cursor:pointer;transition:all .2s;background:transparent;color:#fff}
        .size-btn.selected{background:#F26522;color:#000;border-color:#F26522;font-weight:600}
        .add-btn{transition:transform .15s}.add-btn:hover{transform:scale(1.1)}
        .mod-btn{border:1px solid rgba(242,101,34,.4);border-radius:99px;padding:2px 10px;font-size:.72rem;color:#fff;background:transparent;cursor:pointer}.mod-btn.sel{background:#F26522;color:#000;font-weight:600}
        .mesa-num{width:38px;height:38px;border-radius:10px;border:1px solid rgba(242,101,34,.4);color:#fff;background:transparent;font-weight:700;font-size:.85rem}.mesa-num.sel{background:#F26522;color:#000;border-color:#F26522}

</head>
<body class="overflow-x-hidden">

<!-- ==================== LOGIN DE MESEROS ==================== -->
<div id="mlogin" class="fixed inset-0 z-[400] flex items-center justify-center p-4" style="background:#0c0c0d;background-image:radial-gradient(circle at 50% 15%,rgba(242,101,34,.28),transparent 55%)">
  <div class="w-full max-w-sm rounded-3xl border border-[#F26522]/30 p-8" style="background:#141416">
    <div class="text-center mb-6">
      <img src="logbug.png" class="h-16 mx-auto mb-3" onerror="this.style.display='none'">
      <h1 class="brand-font text-2xl font-bold text-[#F26522]">Acceso Meseros</h1>
      <p class="text-white/40 text-sm mt-1">Inicia sesión para tomar pedidos</p>
    </div>
    <div class="space-y-3">
      <div><label class="text-xs text-white/50 uppercase tracking-widest">Usuario</label>
        <input id="mlogin-user" autocomplete="off" autocapitalize="none" class="w-full mt-1 bg-white/5 border border-white/20 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#F26522]/60" onkeydown="if(event.key==='Enter')document.getElementById('mlogin-pass').focus()"></div>
      <div><label class="text-xs text-white/50 uppercase tracking-widest">Contraseña</label>
        <input id="mlogin-pass" type="password" class="w-full mt-1 bg-white/5 border border-white/20 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-[#F26522]/60" onkeydown="if(event.key==='Enter')meseroLogin()"></div>
      <p id="mlogin-err" class="hidden text-red-400 text-sm"></p>
      <button id="mlogin-btn" onclick="meseroLogin()" class="w-full py-3 rounded-xl font-bold text-lg mt-2" style="background:#F26522;color:#000"><i class="fas fa-right-to-bracket"></i> Entrar</button>
      <p class="text-white/30 text-xs text-center mt-2">Los usuarios se crean en el panel de administración (Configuración → Nuevo usuario).</p>
    </div>
  </div>
</div>

<!-- ==================== MIS MESAS ABIERTAS ==================== -->
<div id="mis-mesas" class="modal fixed inset-0 z-[300] hidden flex items-start justify-center p-4 pt-24">
  <div class="modal-content rounded-3xl w-full max-w-lg max-h-[80vh] overflow-y-auto border border-[#F26522]/30 p-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="brand-font text-2xl text-[#F26522] font-bold">Mis mesas abiertas</h2>
      <button onclick="closeMisMesas()" class="text-white/60 hover:text-white text-3xl leading-none transition">×</button>
    </div>
    <div id="mis-mesas-list"></div>
  </div>
</div>

<header class="fixed top-0 left-0 right-0 z-50 bg-black/80 backdrop-blur-xl border-b border-white/10">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
            <span class="w-9 h-9 rounded-full bg-[#F26522]/20 text-[#F26522] flex items-center justify-center flex-shrink-0"><i class="fas fa-user"></i></span>
            <div class="min-w-0 leading-tight">
                <p class="text-[10px] text-white/40 uppercase tracking-widest">Mesero</p>
                <p id="mesero-chip" class="text-sm font-semibold text-white truncate">—</p>
            </div>
            <button onclick="meseroLogout()" title="Cerrar sesión" class="text-white/40 hover:text-red-400 transition-colors ml-1"><i class="fas fa-right-from-bracket"></i></button>
        </div>
        <img src="logbug.png" alt="Peke's Burger" class="h-10 w-auto flex-shrink-0 hidden sm:block" onerror="this.style.display='none'">
        <div class="flex items-center gap-1 flex-shrink-0">
            <button onclick="openMisMesas()" class="relative px-3 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-white text-sm font-medium transition-colors">
                <i class="fas fa-table-list text-[#F26522]"></i><span class="hidden sm:inline ml-1">Mis mesas</span>
                <span id="mesas-badge" class="cart-badge hidden">0</span>
            </button>
            <button onclick="openCart()" class="relative p-2">
                <i class="fas fa-shopping-bag text-2xl text-white hover:text-[#F26522] transition-colors"></i>
                <span id="cart-badge" class="cart-badge hidden">0</span>
            </button>
        </div>
    </div>
</header>

<main class="pt-24 pb-16 px-4 sm:px-6 max-w-5xl mx-auto">
    <h1 class="brand-font text-5xl sm:text-6xl font-bold text-center mb-2 tracking-wide text-[#F26522]">MENÚ</h1>
    <p class="text-center text-white/50 mb-10 text-sm tracking-widest uppercase">Carne asada · Parrilla · Sirloin · Costillas y más</p>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 sm:gap-5" id="categories"></div>
</main>

<div id="modal" class="modal fixed inset-0 z-50 hidden flex items-center justify-center p-4">
    <div class="modal-content rounded-3xl w-full max-w-2xl max-h-[92vh] overflow-y-auto relative border border-[#F26522]/30 shadow-2xl">
        <button onclick="closeModal()" class="absolute top-4 right-4 text-5xl text-white/80 hover:text-white z-20 transition">×</button>
        <div class="p-6 sm:p-10" id="modal-content"></div>
    </div>
</div>

<div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
<div id="cart-panel">
    <div class="p-5 flex items-center justify-between border-b border-white/10 bg-black/90 backdrop-blur z-10">
        <h2 class="brand-font text-2xl text-[#F26522] font-bold">Tu Pedido</h2>
        <button onclick="closeCart()" class="text-white/60 hover:text-white text-3xl transition leading-none">×</button>
    </div>
    <div class="px-5 py-4 border-b border-white/10 space-y-3">
        <div>
            <label class="block text-white/60 text-xs uppercase tracking-widest mb-2">Mesa <span class="text-[#F26522]">*</span></label>
            <div id="mesa-picker" class="flex flex-wrap gap-1 mb-2"></div>
            <input id="mesa-input" type="number" min="1" inputmode="numeric" placeholder="N° de mesa" oninput="syncMesaPicker()" class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:border-[#F26522]/60 placeholder-white/30">
        </div>
        <div>
            <label class="block text-white/60 text-xs uppercase tracking-widest mb-2">Nombre <span class="text-[#F26522]">*</span></label>
            <input id="table-input" type="text" placeholder="Tu nombre" class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:border-[#F26522]/60 placeholder-white/30">
        </div>
        <div class="grid grid-cols-2 gap-2">
            <div>
                <label class="block text-white/60 text-xs uppercase tracking-widest mb-2">👥 Personas</label>
                <input id="personas-input" type="number" min="1" inputmode="numeric" placeholder="1" class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:border-[#F26522]/60 placeholder-white/30">
            </div>
            <div>
                <label class="block text-white/60 text-xs uppercase tracking-widest mb-2">Celular <span class="text-white/30 normal-case">(opc)</span></label>
                <input id="phone-input" type="tel" inputmode="numeric" placeholder="10 díg." class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:border-[#F26522]/60 placeholder-white/30">
            </div>
        </div>
    </div>
    <div id="cart-items" class="px-5 py-4 space-y-2 flex-1">
        <p class="text-white/30 text-sm text-center py-8">Tu carrito está vacío</p>
    </div>
    <div class="px-5 pb-4 border-t border-white/10 pt-4">
        <label class="block text-white/60 text-xs uppercase tracking-widest mb-2">Notas del pedido</label>
        <textarea id="order-notes" rows="2" placeholder="Sin cebolla, término, especificaciones..." class="w-full bg-white/5 border border-white/20 rounded-xl px-4 py-2 text-white text-sm resize-none focus:outline-none focus:border-[#F26522]/60 placeholder-white/30"></textarea>
    </div>
    <div class="px-5 pb-8 pt-2">
        <div class="flex justify-between items-center mb-4">
            <span class="text-white/60 text-sm">Total estimado</span>
            <span id="cart-total" class="text-[#F26522] text-2xl font-bold">$0</span>
        </div>
        <button onclick="sendOrder()" class="w-full py-4 rounded-2xl font-bold text-lg" style="background:#F26522;color:#000">
            <i class="fas fa-paper-plane mr-2"></i>Enviar Pedido
        </button>
        <button onclick="clearCart()" class="w-full mt-3 py-2 text-white/30 hover:text-white/60 text-sm transition-colors">Vaciar carrito</button>
    </div>
</div>

<!-- Carrito flotante -->
<button id="float-cart" onclick="openCart()" class="hidden fixed left-1/2 -translate-x-1/2 bottom-5 z-[250] items-center gap-2 bg-[#F26522] text-black font-bold px-5 py-3 rounded-full shadow-2xl hover:scale-105 transition-transform">
    <i class="fas fa-shopping-bag"></i>
    <span id="float-cart-count">0</span>
    <span class="opacity-50">·</span>
    <span id="float-cart-total">$0</span>
    <span class="ml-1">Ver pedido →</span>
</button>

<div id="toast" class="toast"></div>

// ==================== CARRITO ====================
let cart=[];
function cartKey(name,size,note){return name+'|'+(size||'')+'|'+(note||'');}

window.addToCart=function(name,price,desc,size,note){
    size=size||'';note=note||'';
    const existing=cart.find(i=>cartKey(i.name,i.size,i.note)===cartKey(name,size,note));
    if(existing)existing.qty++;
    else cart.push({name,price,desc,size,note,qty:1});
    updateCartUI();
    showToast(`+ ${name}${size?' ('+size+')':''}`);
};

window.removeFromCart=function(name,size,note){
    const idx=cart.findIndex(i=>cartKey(i.name,i.size,i.note)===cartKey(name,size||'',note||''));
    if(idx===-1)return;
    if(cart[idx].qty>1)cart[idx].qty--;
    else cart.splice(idx,1);
    updateCartUI();
};

function clearCart(){cart=[];updateCartUI();}

function updateCartUI(){
    const badge=document.getElementById('cart-badge');
    const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
    const count=cart.reduce((s,i)=>s+i.qty,0);
    badge.textContent=count;
    count>0?badge.classList.remove('hidden'):badge.classList.add('hidden');
    document.getElementById('cart-total').textContent=`$${total}`;
    const fc=document.getElementById('float-cart');
    const cartOpen=document.getElementById('cart-panel').classList.contains('open');
    if(count>0&&!cartOpen){fc.classList.remove('hidden');fc.classList.add('flex');}
    else{fc.classList.add('hidden');fc.classList.remove('flex');}
    document.getElementById('float-cart-count').textContent=count+' art.';
    document.getElementById('float-cart-total').textContent=`$${total}`;
    const el=document.getElementById('cart-items');
    if(cart.length===0){el.innerHTML=`<p class="text-white/30 text-sm text-center py-8">Tu carrito está vacío</p>`;refreshModalControls();return;}
    el.innerHTML=cart.map(item=>`<div class="item-row py-3"><div class="flex items-center justify-between gap-3"><div class="flex-1 min-w-0"><p class="text-white text-sm font-medium truncate">${item.name}${item.size?` <span class="text-white/50">(${item.size})</span>`:''}</p><p class="text-[#F26522] text-xs">$${item.price} c/u</p></div><div class="flex items-center gap-2"><button class="qty-btn bg-white/10 hover:bg-white/20 text-white" onclick="removeFromCart('${ea(item.name)}','${ea(item.size||'')}','${ea(item.note||'')}')">−</button><span class="text-white font-bold w-5 text-center text-sm">${item.qty}</span><button class="qty-btn bg-[#F26522]/20 hover:bg-[#F26522]/40 text-[#F26522]" onclick="addToCart('${ea(item.name)}',${item.price},'','${ea(item.size||'')}','${ea(item.note||'')}')">+</button></div><span class="text-white font-bold text-sm w-14 text-right">$${item.price*item.qty}</span></div>${item.note?`<p class="text-yellow-200/80 text-[11px] mt-1 pl-1"><i class="fas fa-angle-right"></i> ${item.note}</p>`:''}</div>`).join('');
    refreshModalControls();
}

function openCart(){document.getElementById('cart-panel').classList.add('open');document.getElementById('cart-overlay').classList.add('active');document.getElementById('float-cart').classList.add('hidden');document.getElementById('float-cart').classList.remove('flex');}

        const existing=Object.values(all).find(o=>o&&String(o.mesa||'')===String(mesa)&&o.status!=='cobrado'&&o.status!=='cancelado');
        if(existing){
            const merged=Array.isArray(existing.items)?existing.items.map(i=>({...i})):[];
            items.forEach(c=>{
                const f=merged.find(i=>cartKey(i.name,i.size,i.note)===cartKey(c.name,c.size,c.note));
                if(f)f.qty+=c.qty; else merged.push({...c});
            });
            const total=merged.reduce((s,i)=>s+i.price*i.qty,0);
            const notes=[existing.notes,newNotes].filter(Boolean).join(' | ');
            return db.ref('orders/'+existing.id).update({items:merged,total,status:'nuevo',phone:phone||existing.phone||'',personas:personas||existing.personas||0,table:table||existing.table,notes,createdBy:existing.createdBy||(MESERO?MESERO.name:'')})
                     .then(()=>'¡Se sumó a la Mesa '+mesa+'! 🍔');
        }else{
            const order={id,table,phone,mesa,personas,notes:newNotes,items,total:items.reduce((s,i)=>s+i.price*i.qty,0),status:'nuevo',createdAt:new Date().toISOString(),createdBy:MESERO?MESERO.name:''};
            return db.ref('orders/'+id).set(order).then(()=>'¡Pedido enviado a cocina! 🍔');
        }
    }).then(msg=>{
        clearCart();
        document.getElementById('order-notes').value='';
        closeCart();
        showToast(msg);
    }).catch(err=>{console.error(err);showToast('Error al enviar. Revisa tu conexión.');});
}

try{buildMesaPicker();}catch(e){}
function showToast(msg){
    const t=document.getElementById('toast');
    t.textContent=msg;t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2500);
}

try{ applyMeseroSession(); }catch(e){console.warn(e);}
try{ listenOpenOrders(); }catch(e){console.warn(e);}
